<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALE</title>

    <link rel="stylesheet" href="css/Kale.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- red de distribución que permite utilizar iconos de font awesome -->
</head>
<body>

<header class="header">

    <!-- bloque de anuncio -->
    <section class="header__anuncio">
        <p class="header__texto">
            ENVÍO GRATIS DESDE BS.300 · PLATA 925 CERTIFICADA · EMPAQUE DE REGALO INCLUIDO
        </p>
    </section>

    <!-- contenedor principal -->
    <section class="header__contenedor">

        <h1 class="header__logo">KALE</h1>

        <!-- buscador -->
        <search class="header__buscador">
            <i class="header__buscador-icono fa-solid fa-magnifying-glass"></i>
            <input class="header__campo" type="text" placeholder="Buscar joyas">
        </search>

        <!-- iconos de navegación -->
        <nav class="header__iconos">
            <a class="header__enlace" href="#" aria-label="Ubicación">
                <i class="fa-solid fa-location-dot"></i>
            </a>
            <a class="header__enlace" href="#" aria-label="Mi cuenta">
                <i class="fa-regular fa-user"></i>
            </a>
            <a class="header__enlace" href="#" aria-label="Favoritos">
                <i class="fa-regular fa-heart"></i>
            </a>
            <a class="header__enlace" href="#" aria-label="Bolsa">
                <i class="fa-solid fa-bag-shopping"></i>
            </a>
        </nav>

    </section>

    <!-- menú de navegación -->
    <nav class="header__menu">
        <a class="header__menu-enlace" href="#">NOVEDADES & DESTACADOS</a>
        <a class="header__menu-enlace" href="#">PULSERAS</a>
        <a class="header__menu-enlace" href="#">ANILLOS</a>
        <a class="header__menu-enlace" href="#">PENDIENTES</a>
        <a class="header__menu-enlace" href="#">COLLARES</a>
        <a class="header__menu-enlace" href="#">COLECCIONES</a>
    </nav>

</header>

<script src="js/main.js"></script>
</body>
</html>
